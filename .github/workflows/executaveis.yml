# Gera o Polpad para Windows e Linux e anexa os arquivos ao release.
#
# * Tag vX.Y.Z enviada (git push origin v0.5.0): testa, gera o instalador
#   do Windows e o pacote do Linux, confere que os dois instalam e abrem, e
#   os anexa ao release da tag com o SHA256SUMS.txt. Se o release ainda não
#   existe, cria um RASCUNHO: escreva as notas, anexe o firmware-*.bin se
#   houver firmware novo e publique como pré-lançamento para testar; tirando
#   o pré-lançamento, a versão vira a oficial. (O aplicativo só enxerga
#   releases publicados que não são pré-lançamento.)
# * Execução manual (aba Actions → Executáveis → Run workflow) ou qualquer
#   PR: testa e gera os arquivos, para baixar em "Artifacts" e
#   testar. Não mexe nos releases.
#
# O PyInstaller não gera executável para outro sistema: cada um sai de um
# runner do próprio sistema.

name: Executáveis

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Em todo PR: são os testes e o empacotamento dos dois sistemas, e o main
  # exige que passem antes do merge.
  pull_request:

permissions:
  contents: read

# Duas execuções da mesma tag disputariam os anexos do release.
concurrency:
  group: executaveis-${{ github.ref }}

jobs:
  build:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows
            os: windows-latest
            arquivo: Polpad-Windows-Instalador.exe
            antigo: Polpad-Setup.exe
          - nome: Linux
            # A glibc do sistema em que o executável é gerado é a mínima que
            # ele exige. O 22.04 (glibc 2.35) cobre Ubuntu 22.04+, Debian 12,
            # Fedora e Arch atuais; gerar no 24.04 deixaria o 22.04 de fora.
            os: ubuntu-22.04
            arquivo: Polpad-Linux-Instalador.tar.gz
            antigo: Polpad-linux-x86_64.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Conferir a versão com a tag
        if: github.ref_type == 'tag'
        run: python tools/conferir_versao.py "$GITHUB_REF_NAME"

      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        # O Qt precisa delas para abrir janelas no X11, e o PyInstaller embute
        # as que encontra: sem a libxcb-cursor0 aqui, o executável não abriria
        # num Ubuntu que não a tenha instalada. O Xvfb é a tela dos testes
        # (o pynput exige um servidor X).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libdbus-1-3 libfontconfig1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python -m unittest discover -t . -v
          else
            python -m unittest discover -t . -v
          fi

      - name: Gerar o executável
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python tools/build_exe.py --instalador
          else
            python tools/build_exe.py
          fi

      - name: Conferir que o executável abre (Linux)
        if: runner.os == 'Linux'
        # Sem QT_QPA_PLATFORM: abre de verdade no X (Xvfb), o que confere
        # também as bibliotecas xcb embutidas. Continuar rodando até o
        # timeout (código 124) é o esperado; sair antes é falha.
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          status=0
          xvfb-run -a timeout 20 ./dist/linux/Polpad || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::o Polpad fechou sozinho (código $status)"
            cat "$XDG_CONFIG_HOME"/Polpad/logs/polpad.log || true
            exit 1
          fi

      - name: Conferir a instalação no menu (Linux)
        if: runner.os == 'Linux'
        run: |
          casa="$RUNNER_TEMP/casa"
          mkdir -p "$casa"
          HOME="$casa" XDG_DATA_HOME= ./dist/linux/Polpad --instalar-no-menu
          test -x "$casa/.local/bin/polpad"
          grep -q "^Exec=$casa/.local/bin/polpad" \
            "$casa/.local/share/applications/polpad.desktop"
          HOME="$casa" XDG_DATA_HOME= "$casa/.local/bin/polpad" --remover-do-menu
          test ! -e "$casa/.local/bin/polpad"

      - name: Conferir a troca e o relançamento (Linux)
        if: runner.os == 'Linux'
        # Uma atualização pendente "9.9.9" apontando para o próprio pacote:
        # ao abrir, o Polpad troca o executável e se reabre sozinho. A nova
        # instância precisa ficar rodando (ela não pode reaproveitar a pasta
        # temporária da que saiu).
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config-troca"
          dados="$XDG_CONFIG_HOME/Polpad"
          mkdir -p "$dados/updates/v9.9.9" "$RUNNER_TEMP/troca"
          cp dist/linux/Polpad "$RUNNER_TEMP/troca/Polpad"
          mkdir -p "$RUNNER_TEMP/pacote/Polpad-Linux"
          cp dist/linux/Polpad "$RUNNER_TEMP/pacote/Polpad-Linux/Polpad"
          pacote="$dados/updates/v9.9.9/Polpad-Linux-Instalador.tar.gz"
          tar -czf "$pacote" -C "$RUNNER_TEMP/pacote" Polpad-Linux
          soma=$(sha256sum "$pacote" | cut -d' ' -f1)
          printf '{"last_check": null, "pending": {"version": "9.9.9", "path": "%s", "sha256": "%s"}, "switch": null}' \
            "$pacote" "$soma" > "$dados/updates/estado.json"
          Xvfb :97 & sleep 2
          export DISPLAY=:97
          timeout 30 "$RUNNER_TEMP/troca/Polpad" || true
          sleep 15
          if ! pgrep -f "troca/Polpad --apos-atualizacao" >/dev/null; then
            echo "::error::o Polpad não continuou rodando depois de se reabrir"
            cat "$dados/logs/polpad.log" || true
            exit 1
          fi
          grep -c "iniciando" "$dados/logs/polpad.log"
          pkill -f "troca/Polpad" || true

      - name: Instalar, abrir e desinstalar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pasta = Join-Path $env:RUNNER_TEMP "pp"
          $inst = Start-Process -FilePath "dist/windows/Polpad-Windows-Instalador.exe" -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$pasta`""
          if ($inst.ExitCode -ne 0) { Write-Error "instalação falhou ($($inst.ExitCode))"; exit 1 }
          $exe = Join-Path $pasta "Polpad.exe"
          if (-not (Test-Path $exe)) { Write-Error "Polpad.exe não foi instalado"; exit 1 }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "config"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Get-Content (Join-Path $env:APPDATA "Polpad/logs/polpad.log") -ErrorAction SilentlyContinue
            Write-Error "o Polpad fechou sozinho (código $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          Start-Process -FilePath (Join-Path $pasta "unins000.exe") -Wait `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { Write-Error "a desinstalação deixou o Polpad.exe"; exit 1 }

      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        # O .tar.gz preserva a permissão de execução, que um download
        # direto do navegador perderia. O de nome antigo, com o executável
        # solto, é o que a 0.5.0 sabe instalar (sai depois da 0.6.0).
        run: |
          mkdir -p pacote/Polpad-Linux
          cp dist/linux/Polpad pacote/Polpad-Linux/Polpad
          cp tools/LEIA-ME-linux.txt pacote/Polpad-Linux/LEIA-ME.txt
          tar -czf "${{ matrix.arquivo }}" -C pacote Polpad-Linux
          tar -czf "${{ matrix.antigo }}" -C dist/linux Polpad

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        run: |
          cp dist/windows/Polpad-Windows-Instalador.exe "${{ matrix.arquivo }}"
          cp dist/windows/Polpad-Windows-Instalador.exe "${{ matrix.antigo }}"

      - uses: actions/upload-artifact@v7
        with:
          name: Polpad-${{ matrix.nome }}
          path: |
            ${{ matrix.arquivo }}
            ${{ matrix.antigo }}
          if-no-files-found: error

  release:
    name: Anexar ao release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          merge-multiple: true

      - name: Somas SHA-256
        working-directory: pacotes
        run: |
          sha256sum Polpad-*.exe Polpad-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Anexar os arquivos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l pacotes
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release criado à mão (ou execução repetida): só troca os anexos.
            gh release upload "$TAG" pacotes/* --clobber
          else
            gh release create "$TAG" pacotes/* --draft --verify-tag \
              --title "Polpad ${TAG#v}" \
              --notes "$(cat <<'NOTAS'
          Rascunho criado pelo workflow **Executáveis**. Escreva as novidades,
          anexe o `firmware-*.bin` se houver firmware novo e publique como
          **pré-lançamento** para testar. Tirando o pré-lançamento, a versão
          vira a oficial e chega aos usuários pelo aviso de atualização.

          ## Arquivos

          - `Polpad-Windows-Instalador.exe` — instalador do Windows 10/11.
          - `Polpad-Linux-Instalador.tar.gz` — Linux (X11, x86-64). Extraia e abra
            o `Polpad` da pasta `Polpad-Linux`; ele se oferece para entrar no
            menu de aplicativos.
          - `Polpad-Setup.exe` e `Polpad-linux-x86_64.tar.gz` — os mesmos, com
            os nomes antigos, para a 0.5.0 se atualizar.
          - `SHA256SUMS.txt` — somas que o Polpad confere antes de instalar.
          NOTAS
          )"
          fi
